<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sediment Component | WDM Viewer</title>
    <style>
        :root {
            --sidebar-width: 320px;
            --header-height: 60px;
            --header-bg: #2c3e50;
            --sidebar-bg: #f8f9fa;
            --accent-color: #3498db;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Arial, sans-serif;
            overflow: hidden; 
        }

        header {
            background-color: var(--header-bg);
            color: white;
            padding: 0 20px;
            height: var(--header-height);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        header h1 { margin: 0; font-size: 1.4rem; }

        .container {
            display: flex;
            height: calc(100vh - var(--header-height));
            width: 100%;
        }

        aside {
            width: var(--sidebar-width);
            min-width: var(--sidebar-width);
            background: var(--sidebar-bg);
            border-right: 1px solid #ddd;
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            overflow-y: auto;
        }

        aside h2 {
            font-size: 0.9rem;
            color: #555;
            text-transform: uppercase;
            margin-bottom: 15px;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 5px;
        }

        .map-selector {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .map-btn {
            background: white;
            border: 1px solid #ccc;
            padding: 12px;
            text-align: left;
            cursor: pointer;
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: 600;
            transition: 0.2s;
        }

        .map-btn:hover { background: #eef6fc; border-color: var(--accent-color); }

        .map-btn.active {
            background: var(--accent-color);
            color: white;
            border-color: #2980b9;
        }

        #mapDescriptionBox {
            margin-top: 20px;
            padding: 15px;
            background: #fff;
            border-left: 4px solid var(--accent-color);
            font-size: 0.85rem;
            line-height: 1.5;
            color: #333;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        main {
            flex-grow: 1;
            background: #eee;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>Sediment Component</h1>
        <div style="font-size: 0.8rem; opacity: 0.8;">Watershed Dynamic Model</div>
    </header>

    <div class="container">
        <aside>
            <h2>Map Layers</h2>
            <div class="map-selector" id="mapList">
                <button class="map-btn" 
                    onclick="loadMap('https://mghydro.com/pages/wdm/', this, true)" 
                    data-info="WDM Web Portal">
                    WDM Web Portal
                </button>

                <button class="map-btn active" 
                    onclick="loadMap('boxplot_sedyield_landuses', this)" 
                    data-info="Boxplot of sediment yields by land use">
                    Sediment yields
                </button>
                
                <button class="map-btn" 
                    onclick="loadMap('sediment_load_land_use', this)" 
                    data-info="Supended sediment loads from land surfaces">
                    Map of sediment loads by subbasin
                </button>
                
                <button class="map-btn" 
                    onclick="loadMap('sediment_delivery_ratios', this)" 
                    data-info="Sediment delivery ratios by subbasin">
                    Map of sediment delivery ratios
                </button>
				
                <button class="map-btn" 
                    onclick="loadMap('sediment_land_use_Agriculture', this)" 
                    data-info="Supended sediment loads from agricultural land">
                    Map of sediment yields: Agriculture
                </button>

                <button class="map-btn" 
                    onclick="loadMap('sediment_land_use_Commercial', this)" 
                    data-info="Supended sediment loads from commercial land">
                    Map of sediment yields: Commercial
                </button>

                <button class="map-btn" 
                    onclick="loadMap('sediment_land_use_Forest', this)" 
                    data-info="Supended sediment loads from forest land">
                    Map of sediment yields: Forest
                </button>

                <button class="map-btn" 
                    onclick="loadMap('sediment_land_use_Grassland', this)" 
                    data-info="Supended sediment loads from grassland">
                    Map of sediment yields: Grassland
                </button>
				
                <button class="map-btn" 
                    onclick="loadMap('sediment_land_use_Shrub', this)" 
                    data-info="Supended sediment loads from shrub land">
                    Map of sediment yields: Shrub
                </button>				

                <button class="map-btn" 
                    onclick="loadMap('sediment_land_use_Industrial', this)" 
                    data-info="Supended sediment loads from industrial land">
                    Map of sediment yields: Industrial
                </button>

                <button class="map-btn" 
                    onclick="loadMap('sediment_land_use_Residential', this)" 
                    data-info="Supended sediment loads from residential land">
                    Map of sediment yields: Residential
                </button>

                <button class="map-btn" 
                    onclick="loadMap('sediment_land_use_Transportation', this)" 
                    data-info="Supended sediment loads from transportation land">
                    Map of sediment yields: Transportation
                </button>				

                <button class="map-btn" 
                    onclick="loadMap('dashboard', this)" 
                    data-info="Plots of observed vs. simulated SSC at calibration stations">
                    SSC calibration dashboard (discrete) 
                </button>

                <button class="map-btn" 
                    onclick="loadMap('dashboard_continuous', this)" 
                    data-info="Plots of observed vs. simulated time series of SSC at calibration stations">
                    SSC calibration dashboard (continuous time series) 
                </button>

                <button class="map-btn" 
                    onclick="loadMap('dashboard_cdfs', this)" 
                    data-info="Plots of observed vs. simulated distributions of SSC at calibration stations">
                    SSC distributions (continuous) 
                </button>

                <button class="map-btn" 
                    onclick="loadMap('dashboard_fractions', this)" 
                    data-info="Plots of observed vs. simulated SSC by fractions at calibration sites">
                    Simulated SSC by fraction (sand, silt, clay) 
                </button>
				
                <button class="map-btn" 
                    onclick="loadMap('dashboard_rating', this)" 
                    data-info="Plots of observed vs. simulated SSC rating curves">
                    Rating curves (discharge vs. SSC) 
                </button>				

                <button class="map-btn" 
                    onclick="loadMap('dashboard_reservoir', this)" 
                    data-info="Plots of suspended sediment loads in reservoirs">
                    Reservoirs
                </button>	
				
                <button class="map-btn" 
                    onclick="loadMap('sediment_load_reaches', this)" 
                    data-info="Supended sediment load in model reaches">
                    Map of suspended sediment loads in model reaches 
                </button>
				
            </div>

            <div id="mapDescriptionBox">
                Simulated and observed suspended sediment concentrations.
            </div>
        </aside>

        <main>
            <iframe id="mapFrame" src="https://pmavellaneda.github.io/wdm/dashboard.html"></iframe>
        </main>
    </div>

    <script>
        function loadMap(mapPath, element, isExternal = false) {
            // 1. Build the correct URL based on whether it is local or external
            const fullUrl = isExternal ? mapPath : `https://pmavellaneda.github.io/wdm/${mapPath}.html`;
            
            // 2. Update the iframe source
            document.getElementById('mapFrame').src = fullUrl;

            // 3. Update button active states
            const buttons = document.querySelectorAll('.map-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');

            // 4. Update the description box text
            const description = element.getAttribute('data-info');
            document.getElementById('mapDescriptionBox').innerText = description;
        }
    </script>
</body>
</html>
